name: Deploy Node Application

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Login to docker hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Docker Image
        run: docker build -t noufalkv/trading_server  .
      - name: Publish Image to docker hub
        run: docker push noufalkv/trading_server:latest

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Login to docker hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
      - name: Pull image from docker hub
        run: sudo docker pull noufalkv/trading_server:latest
      - name: Stop and remove old container
        run: |
          sudo docker stop nodejs-app-container || true
          sudo docker rm nodejs-app-container || true
      - name: Run Docker Container
        run: |
          sudo docker run -d -p 4000:4000 -p 3000:3000 --name nodejs-app-container \
            -e PORT=3000 \
            -e SOCKET_PORT=4000 \
            -e NODE_ENV=development \
            -e WEBSERVER_URI='${{ secrets.WEBSERVER_URI || 'http://localhost:3000,http://localhost:3001' }}' \
            -e MONGO_URI='${{ secrets.MONGO_URI }}' \
            -e JWT_SECRET='${{ secrets.JWT_SECRET }}' \
            -e ACCESS_TOKEN_EXPIRY='${{ secrets.ACCESS_TOKEN_EXPIRY }}' \
            -e REFRESH_TOKEN_SECRET='${{ secrets.REFRESH_TOKEN_SECRET }}' \
            -e REFRESH_TOKEN_EXPIRY='${{ secrets.REFRESH_TOKEN_EXPIRY }}' \
            -e MAIL_HOST='${{ secrets.MAIL_HOST }}' \
            -e MAIL_USER='${{ secrets.MAIL_USER }}' \
            -e MAIL_PASS='${{ secrets.MAIL_PASS }}' \
            -e MAIL_PORT='${{ secrets.MAIL_PORT }}' \
            -e MAIL_FROM='${{ secrets.MAIL_FROM }}' \
            -e REGISTER_SECRET='${{ secrets.REGISTER_SECRET }}' \
            -e REGISTER_SECRET_EXPIRY='${{ secrets.REGISTER_SECRET_EXPIRY }}' \
            -e SOCKET_TOKEN_SECRET='${{ secrets.SOCKET_TOKEN_SECRET }}' \
            -e SOCKET_TOKEN_EXPIRY='${{ secrets.SOCKET_TOKEN_EXPIRY }}' \
            -e REFRESH_SOCKET_TOKEN_SECRET='${{ secrets.REFRESH_SOCKET_TOKEN_SECRET }}' \
            -e REFRESH_SOCKET_TOKEN_EXPIRY='${{ secrets.REFRESH_SOCKET_TOKEN_EXPIRY }}' \
            -e GOOGLE_CLIENT_ID='${{ secrets.GOOGLE_CLIENT_ID }}' \
            --restart unless-stopped \
            noufalkv/trading_server:latest

      - name: Verify deployment
        run: |
          sleep 10
          if docker ps | grep -q nodejs-app-container; then
            echo "✅ Container is running successfully"
            docker logs nodejs-app-container --tail 20
          else
            echo "❌ Container failed to start"
            docker logs nodejs-app-container || true
            exit 1
          fi
